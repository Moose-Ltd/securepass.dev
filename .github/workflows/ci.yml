# Checks every pull request and push to main, then deploys main once they pass (R33). The deploy's
# Cloudflare credential is the Moose-Ltd org secret CF_TOKEN_STATIC, an Account API Token with
# Workers deploy and routes only (no data access). This workflow reads it only in the deploy job,
# which runs in the production environment, and only main may deploy there. Dependabot and fork
# pull requests never receive it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Redeploys main's tip by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the older run; runs on main queue, so a deploy is never
# cancelled midway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://securepass.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Only main's tip deploys, so re-running an old run can never roll production back.
      - name: Check this commit is still main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on to $tip; that commit's own run deploys it."
          fi
      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.tip.outputs.deploy == 'true'
        run: npm ci
      # scripts/deploy.mjs reads the token as SECUREPASS_DEPLOY_TOKEN and verifies it belongs to the
      # personal account before handing it to wrangler. A missing secret fails that check, so the
      # deploy can never skip silently.
      - name: Deploy
        if: steps.tip.outputs.deploy == 'true'
        env:
          SECUREPASS_DEPLOY_TOKEN: ${{ secrets.CF_TOKEN_STATIC }}
          WRANGLER_SEND_METRICS: "false"
        run: npm run deploy
